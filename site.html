<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>DocuMark Site</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="layout">

    <!-- LEFT SIDEBAR -->
    <aside class="sidebar">
        <div class="logo">DocuMark</div>
        <ul id="article-list"></ul>
    </aside>

    <!-- MAIN ARTICLE AREA -->
    <main class="article-container">

        <!-- Article Title -->
        <h1 id="article-title">Select an article</h1>

        <!-- Action Icons -->
        <div class="article-actions">
            <button onclick="showDevMsg()">🔗</button>
            <button onclick="showDevMsg()">📤</button>
            <button onclick="showDevMsg()">⬇️</button>
        </div>

        <!-- Article Content -->
        <div id="published-output" class="content-box">
            <p>Select an article to view</p>
        </div>

    </main>

    <!-- RIGHT SIDE (Search + TOC + Feedback placeholder) -->
    <aside class="right-panel">

        <!-- Search -->
        <div class="search-box">
            <input type="text" placeholder="Search articles..." id="search-input">
        </div>

        <!-- TOC -->
        <div class="toc-box">
            <h3>On this page</h3>
            <div id="toc"></div>
        </div>

        <!-- Feedback (placeholder for now) -->
        <div class="feedback-box">
            <h3>Feedback</h3>
            <p style="font-size: 13px; color: gray;">Coming soon...</p>
        </div>

    </aside>

</div>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="site.js"></script>

</body>
</html>
